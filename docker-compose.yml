services:
  db:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: smart_indoor_planter, MYSQL_USER: planter, MYSQL_PASSWORD: planter, MYSQL_ROOT_PASSWORD: root }
    volumes: [dbdata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, retries: 20 }
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: mysql://planter:planter@db:3306/smart_indoor_planter
      MQTT_BROKER: mqtt://broker.hivemq.com:1883
      CORS_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    restart: unless-stopped
  frontend:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:4000" } }
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes: { dbdata: {} }
